plugins {
    id 'com.android.application'
}

android {
    namespace 'com.litestream.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.litestream.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intentionally no extra dependencies (no Glide/Picasso/etc.)
    // to keep the APK and runtime memory footprint minimal.
}
